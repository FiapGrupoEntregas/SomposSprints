[project]
name = "agrishield-front-web"
version = "0.1.0"
description = "Front-end web (Streamlit) do Sompo AgriShield."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # `altair`, `pandas` e `pydeck` vêm junto do Streamlit, mas o código os importa direto
    # (gráficos, tabelas e mapas). Declarados aqui para um clone limpo não depender de uma
    # dependência transitiva que o Streamlit pode trocar.
    "altair>=5.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "pydeck>=0.9",
    "python-dotenv>=1.2.3",
    # Piso em 1.63: usamos `st.fragment`, `st.toast`, `st.column_config`, `st.link_button` e o
    # parâmetro `width="stretch"`.
    "streamlit>=1.63",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
