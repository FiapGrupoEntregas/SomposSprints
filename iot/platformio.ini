; AgriShield — firmware do dispositivo embarcado (ESP32)
;
; Build:     pio run
; Simular:   extensão Wokwi no VS Code (usa wokwi.toml + diagram.json)
; Wokwi web: copie src/main.ino (como sketch.ino), diagram.json e libraries.txt
;
; Ao adicionar uma biblioteca aqui, adicione também em libraries.txt (Wokwi web).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/DHT sensor library@^1.4.6
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
